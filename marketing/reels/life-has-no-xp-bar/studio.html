<!DOCTYPE html>
<html lang="en" data-theme-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindkraft Motion Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141414; --panel:#1d1f24; --panel2:#22242a; --line:rgba(255,255,255,.07);
    --txt:#f2f2f3; --txt2:#9a9ca3; --blue:#5a9fd4; --blue2:#4a7c9e; --green:#4ade80; --red:#c26a7a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased; display:flex; min-height:100%;
  }
  .studio{display:flex; flex-direction:column; width:100%; max-width:1280px; margin:0 auto; padding:18px 18px 28px}
  header{display:flex; align-items:center; gap:10px; padding:4px 2px 14px}
  .logo{font-size:18px; font-weight:800; letter-spacing:-.02em}
  .logo .b{color:var(--blue)}
  .logo .bolt{color:#fff; margin-right:6px}
  header .sub{font-size:12px; color:var(--txt2); font-weight:500; margin-left:6px}
  .meta{margin-left:auto; font-size:11.5px; color:var(--txt2); font-weight:600; letter-spacing:.02em;
        font-variant-numeric:tabular-nums; display:flex; gap:14px}
  .meta b{color:var(--txt); font-weight:700}
  .stage{display:flex; justify-content:center; align-items:center; flex:1; min-height:0;
         background:
           radial-gradient(120% 120% at 0% 0%, rgba(74,124,158,.10), transparent 60%),
           radial-gradient(120% 120% at 100% 100%, rgba(142,59,95,.09), transparent 60%),
           #101012;
         border:1px solid var(--line); border-radius:16px; padding:20px; overflow:hidden}
  canvas#cv{display:block; max-width:100%; max-height:64vh; border-radius:18px;
            box-shadow:0 18px 60px rgba(0,0,0,.55); background:#000}
  .controls{display:flex; align-items:center; gap:10px; margin-top:16px; flex-wrap:wrap}
  button{font-family:inherit; font-weight:600; font-size:13px; color:var(--txt);
          background:var(--panel2); border:1px solid var(--line); border-radius:10px;
          height:38px; padding:0 16px; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
          transition:.16s background, .16s opacity}
  button:hover{background:#2b2e35}
  button:disabled{opacity:.4; cursor:default}
  button.primary{background:var(--blue2); border-color:transparent; color:#fff}
  button.primary:hover{background:var(--blue)}
  button.rec{background:#3a1f28; border-color:rgba(194,106,122,.4); color:#f0b9c4}
  button.rec:hover{background:#4a2632}
  button.rec.armed{background:#c0344f; border-color:transparent; color:#fff}
  .scrub{flex:1; min-width:160px; display:flex; align-items:center; gap:10px}
  input[type=range]{flex:1; accent-color:var(--blue); height:4px}
  .time{font-variant-numeric:tabular-nums; font-size:12.5px; color:var(--txt2); font-weight:600; min-width:92px; text-align:right}
  .status{font-size:12px; color:var(--txt2); font-weight:600; margin-left:2px; min-height:16px}
  .status.live{color:#f0b9c4}
  .status.done{color:var(--green)}
  .tl{margin-top:16px; border-top:1px solid var(--line); padding-top:14px}
  .tl h3{font-size:9.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--txt2); margin-bottom:10px}
  .beats{display:flex; flex-direction:column; gap:6px}
  .beat{display:grid; grid-template-columns:64px 1fr; gap:12px; font-size:12.5px; padding:5px 8px; border-radius:8px}
  .beat .tt{font-variant-numeric:tabular-nums; color:var(--blue); font-weight:700}
  .beat .lbl{color:var(--txt2)}
  .beat.on{background:rgba(90,159,212,.10)}
  .beat.on .lbl{color:var(--txt)}
  .hint{font-size:11px; color:var(--txt2); margin-top:12px; line-height:1.5}
  .hint b{color:#5a9fd4; font-weight:600}
</style>
</head>
<body>
<div class="studio">
  <header>
    <div class="logo"><span class="bolt">&#9889;</span>mind<span class="b">kraft</span></div>
    <span class="sub">Motion Studio</span>
    <div class="meta">
      <span><b id="mRes">–</b> px</span>
      <span><b id="mFps">–</b> fps</span>
      <span><b id="mDur">–</b> s</span>
    </div>
  </header>

  <div class="stage"><canvas id="cv" width="1080" height="1920"></canvas></div>

  <div class="controls">
    <button class="primary" id="playBtn" onclick="togglePlay()">&#9654; Play</button>
    <button id="restartBtn" onclick="restart()">&#8635; Restart</button>
    <button class="rec" id="recBtn" onclick="toggleRecord()">&#9679; Record &amp; download</button>
    <div class="scrub">
      <input type="range" id="scrub" min="0" max="1000" value="0" oninput="onScrub(this.value)">
      <span class="time" id="time">0.00 / 0.00s</span>
    </div>
    <span class="status" id="status"></span>
  </div>

  <div class="tl">
    <h3>Scene timeline</h3>
    <div class="beats" id="beats"></div>
    <div class="hint">Recording saves a <b>.webm</b> video (no audio) in real time &mdash; let it play to the end.
      Generate the matching soundtrack in Lyria with the prompt provided in chat, then combine video + audio in any editor.</div>
  </div>
</div>

<script>
/* ============================================================================
   MINDKRAFT MOTION STUDIO — ENGINE + BRAND KIT   (do not edit this block)
   The only thing you change per animation is the SCENE object further down.
   ========================================================================== */

/* ---- Brand tokens (from the Mindkraft design brief) --------------------- */
const COL = {
  bg:'#1a1a1a', card:'#22242a', cardEdge:'rgba(255,255,255,0.045)',
  recess:'rgba(255,255,255,0.025)', hair:'rgba(255,255,255,0.05)',
  txt:'#ffffff', txt2:'#b0b0b0', txt3:'rgba(255,255,255,0.44)', txt4:'rgba(255,255,255,0.22)',
  blue:'#5a9fd4', blueDk:'#4a7c9e', green:'#4ade80', greenXp:'#6dbf7e',
  coral:'#fb923c', coralBg:'rgba(251,146,60,0.14)', amber:'#fbbf24', amberBg:'rgba(251,191,36,0.13)',
  red:'#c26a7a', redDk:'#8e3b5f', gold:'#f5c563', track:'rgba(255,255,255,0.07)',
  // dimension accents
  dim:{focus:'#5a9fd4', body:'#6b8b6f', mind:'#7a5d9e', social:'#c26a7a', craft:'#b88242'}
};

/* ---- Math + easing ------------------------------------------------------ */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const E={
  linear:t=>t,
  inQuad:t=>t*t,
  outQuad:t=>1-(1-t)*(1-t),
  inOut:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,
  outCubic:t=>1-Math.pow(1-t,3),
  inOutCubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  outExpo:t=>t>=1?1:1-Math.pow(2,-10*t),
  outBack:(t,s=1.70158)=>1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2),
  outElastic:t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-0.75)*((2*Math.PI)/3))+1
};
/* progress 0..1 of a sub-interval starting at t0 lasting dur */
const prog=(t,t0,dur)=>clamp((t-t0)/dur,0,1);
/* eased tween of a value across [t0, t0+dur] */
const tween=(t,t0,dur,from,to,ease=E.outCubic)=>from+(to-from)*ease(prog(t,t0,dur));
/* 1 only while t in [t0, t0+dur], used to gate effects */
const within=(t,t0,dur)=>t>=t0&&t<=t0+dur;

/* ---- Canvas helpers ----------------------------------------------------- */
const fn=(w,s)=>`${w} ${s}px 'Inter',-apple-system,sans-serif`;
function rr(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function shadow(c,col,blur,oy=0){c.shadowColor=col;c.shadowBlur=blur;c.shadowOffsetY=oy;}
function noShadow(c){c.shadowColor='transparent';c.shadowBlur=0;c.shadowOffsetY=0;}

/* atmospheric background sized to the canvas (the "scene" the app floats in) */
function sceneBg(c,W,H,energy=0){
  c.fillStyle=COL.bg; c.fillRect(0,0,W,H);
  const pulse=1+0.06*Math.sin(energy*Math.PI*2);
  const blobs=[
    [W*0.12,H*0.10,Math.max(W,H)*0.55*pulse,'rgba(74,124,158,0.20)'],
    [W*0.92,H*0.94,Math.max(W,H)*0.50*pulse,'rgba(142,59,95,0.17)'],
    [W*0.5,H*0.5,Math.max(W,H)*0.34,'rgba(58,58,92,0.12)']
  ];
  for(const[x,y,r,col]of blobs){
    const g=c.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=g; c.fillRect(0,0,W,H);
  }
}

/* the Mindkraft wordmark */
function mkLogo(c,x,y,size,align='left'){
  c.save(); c.textBaseline='alphabetic'; c.textAlign='left';
  c.font=fn(800,size);
  const boltW=size*1.05, gap=size*0.30;
  const mindW=c.measureText('mind').width, kraftW=c.measureText('kraft').width;
  const total=boltW+gap+mindW+kraftW;
  let sx=x; if(align==='center')sx=x-total/2; else if(align==='right')sx=x-total;
  c.font=fn(800,size*1.0); c.fillStyle='#fff';
  shadow(c,'rgba(90,159,212,0.55)',size*0.5); c.fillText('\u26A1',sx,y); noShadow(c);
  c.font=fn(800,size); c.fillStyle='#fff'; c.fillText('mind',sx+boltW+gap,y);
  c.fillStyle=COL.blue; c.fillText('kraft',sx+boltW+gap+mindW,y);
  c.restore();
  return total;
}

/* phone device frame; draws screen content via callback, clipped to the screen */
function phone(c,x,y,w,h,drawScreen){
  c.save();
  const r=w*0.12;
  // outer body
  shadow(c,'rgba(0,0,0,0.6)',w*0.16,w*0.06);
  rr(c,x,y,w,h,r); c.fillStyle='#0a0b0d'; c.fill(); noShadow(c);
  // metal rim highlight
  rr(c,x,y,w,h,r); c.lineWidth=Math.max(1.5,w*0.006); c.strokeStyle='rgba(255,255,255,0.10)'; c.stroke();
  // screen
  const bz=w*0.035, sx=x+bz, sy=y+bz, sw=w-bz*2, sh=h-bz*2, sr=r-bz;
  c.save(); rr(c,sx,sy,sw,sh,sr); c.clip();
  c.fillStyle=COL.bg; c.fillRect(sx,sy,sw,sh);
  drawScreen(c,sx,sy,sw,sh);
  c.restore();
  // dynamic-island notch
  const nw=sw*0.30, nh=sh*0.018, nx=sx+(sw-nw)/2, ny=sy+sh*0.018;
  rr(c,nx,ny,nw,nh,nh/2); c.fillStyle='#000'; c.fill();
  // top screen glow
  c.restore();
}

/* card material per the brief: surface, not borders */
function card(c,x,y,w,h,o={}){
  const r=o.r??Math.min(14,h*0.16);
  c.save();
  shadow(c,'rgba(0,0,0,0.45)',h*0.28,h*0.06);
  rr(c,x,y,w,h,r); c.fillStyle=o.bg||COL.card; c.fill(); noShadow(c);
  // top inset highlight + bottom inset shadow (approximated with hairlines)
  rr(c,x,y,w,h,r); c.lineWidth=1; c.strokeStyle=COL.cardEdge; c.stroke();
  c.save(); rr(c,x,y,w,h,r); c.clip();
  c.strokeStyle='rgba(255,255,255,0.075)'; c.lineWidth=1;
  c.beginPath(); c.moveTo(x+r*0.4,y+0.5); c.lineTo(x+w-r*0.4,y+0.5); c.stroke();
  c.restore();
  // dimension left-edge bar
  if(o.dim){
    const bw=Math.max(3,w*0.012);
    rr(c,x,y+r*0.5,bw,h-r,bw/2);
    c.fillStyle=o.dim; c.fill();
    if(o.dimGlow){ shadow(c,o.dim,12); c.fill(); noShadow(c); }
  }
  c.restore();
}

/* XP progress bar (track + gradient fill) */
function xpBar(c,x,y,w,h,pct){
  c.save();
  rr(c,x,y,w,h,h/2); c.fillStyle=COL.track; c.fill();
  pct=clamp(pct,0,1);
  if(pct>0.001){
    rr(c,x,y,w*pct,h,h/2);
    const g=c.createLinearGradient(x,0,x+w,0);
    g.addColorStop(0,COL.blueDk); g.addColorStop(1,COL.blue);
    c.fillStyle=g; shadow(c,'rgba(90,159,212,0.5)',h*1.4); c.fill(); noShadow(c);
  }
  c.restore();
}

/* pill chip; kind: 'xp' | 'streak' | 'warn' | 'counter' */
function chip(c,x,y,text,kind='counter',scale=1){
  c.save(); c.font=fn(700,15*scale); c.textBaseline='middle';
  const padX=12*scale, h=24*scale, tw=c.measureText(text).width, w=tw+padX*2;
  let bg,fg;
  if(kind==='xp'){bg=null;fg=COL.greenXp;}
  else if(kind==='streak'){bg=COL.coralBg;fg=COL.coral;}
  else if(kind==='warn'){bg=COL.amberBg;fg=COL.amber;}
  else{bg='rgba(90,159,212,0.16)';fg=COL.blue;}
  if(bg){rr(c,x,y,w,h,h/2);c.fillStyle=bg;c.fill();}
  c.fillStyle=fg; c.textAlign='left'; c.fillText(text,x+padX,y+h/2);
  c.restore();
  return w;
}

/* big tabular number (level display) */
function bigNum(c,x,y,text,size,color=COL.txt){
  c.save(); c.font=fn(800,size); c.fillStyle=color;
  c.textAlign='center'; c.textBaseline='middle';
  c.fillText(text,x,y); c.restore();
}

/* toast pill */
function toast(c,cx,y,text){
  c.save(); c.font=fn(600,26); c.textBaseline='middle';
  const tw=c.measureText(text).width, padX=34, h=64, w=tw+padX*2, x=cx-w/2;
  shadow(c,'rgba(0,0,0,0.5)',30,8);
  rr(c,x,y,w,h,h/2); c.fillStyle=COL.card; c.fill(); noShadow(c);
  rr(c,x,y,w,h,h/2); c.lineWidth=1; c.strokeStyle=COL.cardEdge; c.stroke();
  c.fillStyle=COL.txt; c.textAlign='center'; c.fillText(text,cx,y+h/2);
  c.restore();
}

/* expanding tap ripple (p = 0..1) */
function tapRipple(c,x,y,p,col=COL.blue){
  if(p<=0||p>=1)return;
  c.save();
  c.beginPath(); c.arc(x,y,lerp(8,80,E.outCubic(p)),0,Math.PI*2);
  c.strokeStyle=col; c.globalAlpha=1-p; c.lineWidth=4; c.stroke();
  c.beginPath(); c.arc(x,y,lerp(2,30,E.outCubic(p)),0,Math.PI*2);
  c.fillStyle=col; c.globalAlpha=(1-p)*0.4; c.fill();
  c.restore();
}

/* indicator primitive: glowing underline */
function indicator(c,cx,y,w,col=COL.blue){
  c.save();
  const g=c.createLinearGradient(cx-w/2,0,cx+w/2,0);
  g.addColorStop(0,'transparent'); g.addColorStop(.3,col); g.addColorStop(.7,col); g.addColorStop(1,'transparent');
  shadow(c,col,14); c.fillStyle=g; c.fillRect(cx-w/2,y,w,2.4); c.restore();
}

/* golden level-up sparkle burst (p = 0..1) */
function sparkleBurst(c,x,y,p,n=14,rad=120){
  if(p<=0)return;
  c.save();
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2 + p*0.6;
    const d=E.outExpo(p)*rad*(0.6+0.4*((i*37)%n)/n);
    const px=x+Math.cos(a)*d, py=y+Math.sin(a)*d;
    const s=lerp(7,1,p);
    c.globalAlpha=(1-p);
    c.fillStyle=COL.gold; shadow(c,'rgba(245,197,99,0.9)',16);
    c.beginPath(); c.arc(px,py,s,0,Math.PI*2); c.fill();
  }
  noShadow(c); c.restore();
}

/* ---------------------------------------------------------------------------
   SCENE — EDIT THIS OBJECT ONLY.
   meta: title, w, h, fps, duration (seconds)
   timeline: array of {t, label} beats (drives the readout + your audio prompt)
   draw(c, t): renders ONE frame at elapsed time t (seconds). Pure function of t.
   ------------------------------------------------------------------------- */
// ============ SCENE:BEGIN — replace everything down to SCENE:END ============
/* "Life has no XP bar." — Mindkraft promo reel, 1080×1920 (9:16), 15s.
   Hook → the grind → LEVEL 10 (the hero) → "Now it does." → brand lockup.
   Everything below is a pure function of t. */

/* Brand mark: the brain-MK app icon (icon-192.svg with its background square
   removed). Rasterised once to an offscreen canvas so every frame reuses it. */
const MK_ICON = new Image();
let MK_ICON_CV = null;
MK_ICON.onload = () => {
  const k = document.createElement('canvas'); k.width = k.height = 900;
  k.getContext('2d').drawImage(MK_ICON, 0, 0, 900, 900);
  MK_ICON_CV = k;
  try { renderFrame(st.t); } catch (e) {}

      rr(c, x, y, fw, h, h / 2);
      const g = c.createLinearGradient(x, 0, x + fw, 0);
      g.addColorStop(0, COL.blueDk); g.addColorStop(0.75, COL.blue); g.addColorStop(1, '#bfe3ff');
      c.fillStyle = g; shadow(c, 'rgba(90,159,212,0.85)', h * 2.2 * glow); c.fill(); noShadow(c);
    }
    if (flare > 0.01) {
      const fx = x + (pct > 0.001 ? fw - h * 0.5 : h * 0.5), fy = y + h / 2;
      const r = h * (3 + 5 * flare);
      const g = c.createRadialGradient(fx, fy, 0, fx, fy, r);
      g.addColorStop(0, `rgba(255,255,255,${0.95 * flare})`);
      g.addColorStop(0.18, `rgba(191,227,255,${0.7 * flare})`);
      g.addColorStop(0.5, `rgba(90,159,212,${0.28 * flare})`);
      g.addColorStop(1, 'rgba(90,159,212,0)');
      c.globalCompositeOperation = 'lighter';
      c.fillStyle = g; c.fillRect(fx - r, fy - r, r * 2, r * 2);
      // horizontal anamorphic streak
      const sg = c.createLinearGradient(fx - r * 3, 0, fx + r * 3, 0);
      sg.addColorStop(0, 'rgba(90,159,212,0)'); sg.addColorStop(0.5, `rgba(191,227,255,${0.55 * flare})`);
      sg.addColorStop(1, 'rgba(90,159,212,0)');
      c.fillStyle = sg; c.fillRect(fx - r * 3, fy - 1.5, r * 6, 3);
      c.globalCompositeOperation = 'source-over';
    }
    c.restore();
  }

  /* ---------------- small icons ---------------- */
  function flame(c, x, y, s, col, glow) {
    c.save(); c.translate(x, y); c.scale(s / 24, s / 24); c.translate(-12, -12);
    c.beginPath();
    c.moveTo(12, 1.8);
    c.bezierCurveTo(13.8, 6.2, 19.4, 8.8, 19.4, 14.6);
    c.bezierCurveTo(19.4, 18.8, 16.1, 22, 12, 22);
    c.bezierCurveTo(7.9, 22, 4.6, 18.8, 4.6, 14.6);
    c.bezierCurveTo(4.6, 11.4, 6.5, 9.3, 8.1, 7.9);
    c.bezierCurveTo(8.3, 10.3, 9.3, 11.7, 10.6, 12.1);
    c.bezierCurveTo(10.1, 8.4, 10.7, 4.9, 12, 1.8);
    c.closePath();
    c.fillStyle = col; if (glow > 0) shadow(c, col, glow); c.fill(); noShadow(c);
    c.beginPath();
    c.moveTo(12, 12.2);
    c.bezierCurveTo(13.2, 14.6, 15.4, 15.4, 15.4, 17.6);
    c.bezierCurveTo(15.4, 19.5, 13.9, 20.8, 12, 20.8);
    c.bezierCurveTo(10.1, 20.8, 8.6, 19.5, 8.6, 17.6);
    c.bezierCurveTo(8.6, 15.4, 10.9, 14.6, 12, 12.2);
    c.closePath(); c.fillStyle = 'rgba(255,236,205,0.85)'; c.fill();
    c.restore();
  }
  function gritIcon(c, x, y, s) {
    c.save(); c.translate(x - s / 2, y - s / 2); c.scale(s / 24, s / 24);
    c.strokeStyle = COL.gold; c.lineWidth = 2.2; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(12, 2.6); c.lineTo(20.4, 11); c.lineTo(12, 21.4); c.lineTo(3.6, 11); c.closePath(); c.stroke();
    c.beginPath(); c.moveTo(3.6, 11); c.lineTo(20.4, 11); c.stroke();
    c.restore();
  }
  function checkMark(c, cx, cy, r, k, col) {
    if (k <= 0) return;
    c.save(); c.strokeStyle = col; c.lineWidth = r * 0.2; c.lineCap = 'round'; c.lineJoin = 'round';
    const a = [cx - r * 0.42, cy + r * 0.02], b = [cx - r * 0.1, cy + r * 0.34], d = [cx + r * 0.46, cy - r * 0.36];
    const k1 = clamp(k * 2, 0, 1), k2 = clamp(k * 2 - 1, 0, 1);
    c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(lerp(a[0], b[0], k1), lerp(a[1], b[1], k1));
    if (k2 > 0) c.lineTo(lerp(b[0], d[0], k2), lerp(b[1], d[1], k2));
    c.stroke(); c.restore();
  }

  /* ---------------- XP + streak state (from t) ---------------- */
  const CARDS = [
    { name: 'Run 5km', xp: 30, dim: COL.dim.body, streak: 12 },
    { name: 'Read 20 pages', xp: 15, dim: COL.dim.focus, streak: 9 },
    { name: 'Meditate', xp: 25, dim: COL.dim.mind, streak: 12 },
    { name: 'Deep work · 2h', xp: 40, dim: COL.dim.craft, streak: 5 },
  ];
  const NEED = 200, START_TO_NEXT = 180, START_TOTAL = 2420;
  const MONTAGE_XP = 70;
  const stepTime = s => T.streak + Math.pow(s / 18, 1 / 1.8) * T.streakDur;   // when day 12+s lands
  function streakRaw(t) { return 18 * Math.pow(prog(t, T.streak, T.streakDur), 1.8); }
  function streakDays(t) { return Math.floor(streakRaw(t) + 1e-6); }             // 0..18 added days
  function streakSmooth(t) {
    const r = streakRaw(t), d = Math.floor(r + 1e-6);
    return d >= 18 ? 18 : d + E.outCubic(clamp((r - d) * 3, 0, 1));
  }
  function xpState(t) {
    let gained = 0;
    CARDS.forEach((cd, i) => { gained += cd.xp * E.outCubic(prog(t, T.taps[i] + 0.42, 0.32)); });
    gained += MONTAGE_XP * (streakSmooth(t) / 18);
    const toNext = START_TO_NEXT - gained;
    return { toNext: Math.max(0, toNext), total: START_TOTAL + gained, pct: 1 - toNext / NEED };
  }
  const fmtInt = n => Math.round(n).toLocaleString('en-US');

  /* ---------------- phone placement + screen layout ---------------- */
  const PW = 700, PH = PW * 2.03, BZ = PW * 0.035;
  const SW = PW - BZ * 2, SH = PH - BZ * 2;
  const L = {
    pad: 38, y0: 100,
    get barX() { return this.pad + 104; },
    get barW() { return SW - this.pad - 74 - this.barX; },
    get barY() { return this.y0 + 54; },
    barH: 10,
    cardsY: 338, cardH: 120, cardGap: 18,
    streakY: 894, streakH: 204,
    navY: SH - 200,
  };
  function phoneState(t) {
    const p = prog(t, T.rise, 0.8);
    const s = lerp(0.9, 1, E.outCubic(p));
    const y = lerp(H + 70, 262, E.outCubic(p)) + Math.sin((t - 3) * 1.3) * 6 * prog(t, 3.0, 0.8);
    return { x: CX - PW * s / 2, y, s };
  }
  const toGlobal = (ps, lx, ly) => [ps.x + ps.s * (BZ + lx), ps.y + ps.s * (BZ + ly)];

  function levelDigitCenter(c) {
    c.save(); c.font = fn(800, 64);
    const m = c.measureText('9');
    const asc = m.actualBoundingBoxAscent || 46;
    c.restore();
    return [L.pad + m.width / 2, L.y0 + 80 - asc / 2];
  }

  /* ---------------- the app screen ---------------- */
  function drawScreen(c, sx, sy, sw, sh, t) {
    const X = sx, Y = sy, pad = L.pad;
    // in-app ambient glows (the app's bg-glow-a / bg-glow-b)
    for (const [gx, gy, r, col] of [[0.18, 0.12, 0.9, 'rgba(74,124,158,0.16)'], [0.85, 0.88, 0.9, 'rgba(142,59,95,0.12)']]) {
      const g = c.createRadialGradient(X + sw * gx, Y + sh * gy, 0, X + sw * gx, Y + sh * gy, sw * r);
      g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(X, Y, sw, sh);
    }
    const ui = prog(t, T.rise + 0.05, 0.4);   // header chrome fades in as the phone lands
    const xs = xpState(t);

    // status bar
    c.save(); c.globalAlpha = ui;
    c.font = fn(600, 24); c.fillStyle = COL.txt; c.textBaseline = 'middle'; c.textAlign = 'left';
    c.fillText('9:41', X + pad + 12, Y + 44);
    const bx = X + sw - pad - 44, by = Y + 35;
    rr(c, bx, by, 38, 18, 5); c.strokeStyle = 'rgba(255,255,255,0.5)'; c.lineWidth = 2; c.stroke();
    rr(c, bx + 3, by + 3, 28, 12, 3); c.fillStyle = COL.txt; c.fill();
    rr(c, bx + 40, by + 6, 3, 6, 1.5); c.fillStyle = 'rgba(255,255,255,0.5)'; c.fill();
    for (let i = 0; i < 4; i++) { rr(c, bx - 44 + i * 8, by + 13 - i * 4, 5, 5 + i * 4, 1.5); c.fillStyle = COL.txt; c.fill(); }
    c.restore();

    // ---- header: LEVEL + digit | XP meta + bar | avatar ----
    const y0 = Y + L.y0;
    c.save(); c.globalAlpha = ui;
    c.font = fn(700, 15); c.fillStyle = COL.txt3; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    c.letterSpacing = '2.5px'; c.fillText('LEVEL', X + pad, y0 + 14); c.letterSpacing = '0px';
    // digit (+ glow as the bar nears full)
    c.font = fn(800, 64); c.letterSpacing = '-2.5px';
    const dm = c.measureText('9'), dasc = dm.actualBoundingBoxAscent || 46;
    const charge = clamp((xs.pct - 0.8) / 0.2, 0, 1);
    if (charge > 0) shadow(c, `rgba(90,159,212,${0.9 * charge})`, 30 * charge);
    c.fillStyle = brandGrad(c, X + pad, dm.width, y0 + 80, dasc, 0.3);
    c.fillText('9', X + pad, y0 + 80); noShadow(c); c.letterSpacing = '0px';
    // meta row
    const bX = X + L.barX, bW = L.barW, bY = Y + L.barY;
    c.textBaseline = 'alphabetic';
    c.font = fn(800, 21); c.fillStyle = COL.txt; c.textAlign = 'left';
    const tot = fmtInt(xs.total); c.fillText(tot, bX + 4, y0 + 40);
    const tw = c.measureText(tot).width;
    c.font = fn(600, 17); c.fillStyle = COL.txt3; c.fillText(' XP', bX + 4 + tw, y0 + 40);
    c.textAlign = 'right'; c.fillStyle = COL.txt3;
    c.fillText(`${fmtInt(xs.toNext)} XP to next`, bX + bW - 4, y0 + 40);
    // avatar
    const ax = X + sw - pad - 28, ay = y0 + 46;
    c.beginPath(); c.arc(ax, ay, 28, 0, TAU);
    const ag = c.createLinearGradient(ax - 28, ay - 28, ax + 28, ay + 28);
    ag.addColorStop(0, '#3a5f7c'); ag.addColorStop(1, '#2a2d44'); c.fillStyle = ag; c.fill();
    c.beginPath(); c.arc(ax, ay, 28, 0, TAU); c.strokeStyle = 'rgba(255,255,255,0.12)'; c.lineWidth = 2; c.stroke();
    c.fillStyle = 'rgba(255,255,255,0.85)';
    c.beginPath(); c.arc(ax, ay - 7, 8.5, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(ax, ay + 15, 15, 10, 0, Math.PI, TAU); c.fill();
    c.restore();
    // the XP bar itself (hidden until the flying track lands in it)
    if (t >= T.rise + T.morph) {
      xpBar(c, bX, bY, bW, L.barH, xs.pct);
      if (charge > 0) { // charged shimmer running along the fill
        const sp = ((t * 1.6) % 1);
        c.save(); rr(c, bX, bY, bW * clamp(xs.pct, 0, 1), L.barH, L.barH / 2); c.clip();
        const gx = bX + bW * xs.pct * sp;
        const g = c.createLinearGradient(gx - 60, 0, gx + 60, 0);
        g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, `rgba(255,255,255,${0.55 * charge})`); g.addColorStop(1, 'rgba(255,255,255,0)');
        c.fillStyle = g; c.fillRect(gx - 60, bY, 120, L.barH); c.restore();
      }
      const full = prog(t, T.dive - 0.06, 0.12);
      if (full > 0 && full < 1) { c.save(); c.globalAlpha = Math.sin(full * Math.PI); rr(c, bX, bY, bW, L.barH, L.barH / 2); c.fillStyle = '#fff'; shadow(c, '#bfe3ff', 24); c.fill(); c.restore(); }
    }

    // ---- page strip: crumb + title, grit pill ----
    const y1 = Y + 216;
    c.save(); c.globalAlpha = ui;
    c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    c.font = fn(600, 16); c.fillStyle = COL.txt3; c.fillText('Activities  ›', X + pad, y1);
    c.font = fn(800, 32); c.fillStyle = COL.txt; c.letterSpacing = '-0.6px'; c.fillText('My Activities', X + pad, y1 + 40); c.letterSpacing = '0px';
    const gpx = X + sw - pad - 112, gpy = y1 + 2;
    rr(c, gpx, gpy, 112, 44, 22); c.fillStyle = COL.recess; c.fill();
    rr(c, gpx, gpy, 112, 44, 22); c.strokeStyle = 'rgba(245,197,99,0.18)'; c.lineWidth = 1.5; c.stroke();
    gritIcon(c, gpx + 30, gpy + 22, 20);
    c.font = fn(700, 19); c.fillStyle = COL.txt; c.textBaseline = 'middle'; c.fillText('340', gpx + 50, gpy + 23);
    c.restore();

    // ---- TODAY kicker + done counter ----
    const done = CARDS.reduce((n, cd, i) => n + (t >= T.taps[i] ? 1 : 0), 0);
    c.save(); c.globalAlpha = prog(t, T.cards - 0.05, 0.4);
    c.font = fn(700, 16); c.fillStyle = COL.txt4; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    c.letterSpacing = '5px'; c.fillText('TODAY', X + pad, Y + 318); c.letterSpacing = '0px';
    c.textAlign = 'right'; c.font = fn(700, 17); c.fillStyle = done === 4 ? COL.green : COL.txt3;
    c.fillText(`${done} / 4`, X + sw - pad, Y + 318);
    c.restore();

    // ---- activity cards ----
    const cw = sw - pad * 2, cx0 = X + pad;
    const addDays = streakDays(t);
    CARDS.forEach((cd, i) => {
      const appear = prog(t, T.cards + i * 0.075, 0.5);
      if (appear <= 0) return;
      const tap = T.taps[i];
      const cy = Y + L.cardsY + i * (L.cardH + L.cardGap) + lerp(44, 0, E.outBack(appear));
      const ch = L.cardH;
      const isDone = t >= tap;
      const pulse = Math.max(0, 1 - prog(t, tap, 0.42));
      const press = within(t, tap - 0.1, 0.1) ? 1 - 0.025 * prog(t, tap - 0.1, 0.1) : 1;
      const ps = (isDone ? 1 + 0.045 * Math.sin(pulse * Math.PI) : press);
      c.save(); c.globalAlpha = appear;
      c.translate(cx0 + cw / 2, cy + ch / 2); c.scale(ps, ps); c.translate(-(cx0 + cw / 2), -(cy + ch / 2));
      card(c, cx0, cy, cw, ch, { dim: cd.dim, dimGlow: isDone, bg: isDone ? '#1e2420' : COL.card, r: 18 });
      // completion wash
      if (pulse > 0 && isDone) { rr(c, cx0, cy, cw, ch, 18); c.fillStyle = `rgba(74,222,128,${0.14 * pulse})`; c.fill(); }
      c.textAlign = 'left'; c.textBaseline = 'alphabetic';
      c.font = fn(700, 29); c.fillStyle = isDone ? 'rgba(255,255,255,0.78)' : COL.txt;
      c.letterSpacing = '-0.4px'; c.fillText(cd.name, cx0 + 36, cy + 52); c.letterSpacing = '0px';
      // chips: +XP and streak
      c.font = fn(700, 19); c.fillStyle = isDone ? COL.green : COL.greenXp;
      const xpText = `+${cd.xp} XP`; c.fillText(xpText, cx0 + 36, cy + 90);
      const xw = c.measureText(xpText).width;
      const sN = cd.streak + (isDone ? 1 : 0) + Math.max(0, addDays - 1);
      const sx0 = cx0 + 36 + xw + 16, sy0 = cy + 70;
      c.font = fn(700, 17); const sTxt = String(sN), stw = c.measureText(sTxt).width;
      rr(c, sx0, sy0, stw + 50, 28, 14); c.fillStyle = COL.coralBg; c.fill();
      flame(c, sx0 + 17, sy0 + 14, 17, COL.coral, 0);
      c.fillStyle = COL.coral; c.textBaseline = 'middle'; c.fillText(sTxt, sx0 + 31, sy0 + 15);
      // completion circle
      const r = 27, ccx = cx0 + cw - 58, ccy = cy + ch / 2;
      c.beginPath(); c.arc(ccx, ccy, r, 0, TAU);
      if (isDone) {
        const k = prog(t, tap, 0.3);
        c.fillStyle = COL.green; shadow(c, 'rgba(74,222,128,0.65)', 18 + 20 * pulse); c.fill(); noShadow(c);
        checkMark(c, ccx, ccy, r, k, '#0c1f12');
      } else { c.strokeStyle = 'rgba(255,255,255,0.2)'; c.lineWidth = 2.5; c.stroke(); }
      c.restore();

      // touch: finger dot → press → ripple
      const fx = cx0 + cw * 0.46, fy = cy + ch * 0.52;
      const tIn = prog(t, tap - 0.2, 0.14), tOut = prog(t, tap + 0.06, 0.2);
      if (tIn > 0 && tOut < 1) {
        const s = lerp(1.35, 1, E.outCubic(tIn)) * (within(t, tap - 0.06, 0.12) ? 0.86 : 1);
        c.save(); c.globalAlpha = tIn * (1 - tOut) * 0.9;
        c.beginPath(); c.arc(fx, fy, 30 * s, 0, TAU);
        c.fillStyle = 'rgba(255,255,255,0.28)'; c.fill();
        c.lineWidth = 2.5; c.strokeStyle = 'rgba(255,255,255,0.6)'; c.stroke();
        c.restore();
      }
      tapRipple(c, fx, fy, prog(t, tap - 0.02, 0.5), COL.green);
      if (t >= tap) {
        const rp = prog(t, tap, 0.6);
        if (rp < 1) { c.save(); c.globalAlpha = (1 - rp) * 0.6; c.beginPath(); c.arc(ccx, ccy, lerp(r, r * 3.2, E.outCubic(rp)), 0, TAU); c.strokeStyle = COL.green; c.lineWidth = 3; c.stroke(); c.restore(); }
      }
    });

    // ---- streak card: flame + days + 30-day heatmap ----
    {
      const appear = prog(t, T.cards + 4 * 0.075, 0.5);
      if (appear > 0) {
        const sy0 = Y + L.streakY + lerp(44, 0, E.outBack(appear)), sh0 = L.streakH;
        const days = 12 + addDays;
        const lastStep = addDays > 0 ? stepTime(addDays) : -9;
        const pop = 1 - prog(t, lastStep, 0.16);
        const heat = clamp(addDays / 18, 0, 1);
        c.save(); c.globalAlpha = appear;
        card(c, cx0, sy0, cw, sh0, { r: 20, bg: COL.card });
        if (heat > 0) { // warm the card as the streak grows
          const g = c.createRadialGradient(cx0 + 90, sy0 + 100, 0, cx0 + 90, sy0 + 100, 360);
          g.addColorStop(0, `rgba(251,146,60,${0.16 * heat})`); g.addColorStop(1, 'rgba(251,146,60,0)');
          c.save(); rr(c, cx0, sy0, cw, sh0, 20); c.clip(); c.fillStyle = g; c.fillRect(cx0, sy0, cw, sh0); c.restore();
        }
        c.font = fn(700, 14); c.fillStyle = COL.txt4; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
        c.letterSpacing = '4px'; c.fillText('STREAK', cx0 + 34, sy0 + 44); c.letterSpacing = '0px';
        const fs = 58 * (1 + 0.28 * heat) * (1 + 0.1 * pop);
        flame(c, cx0 + 68, sy0 + 118, fs, COL.coral, 10 + 30 * heat + 20 * pop);
        c.save();
        const nx = cx0 + 118, ny = sy0 + 142;
        c.font = fn(800, 84); c.letterSpacing = '-3px';
        c.translate(nx, ny); c.scale(1 + 0.12 * pop, 1 + 0.12 * pop);
        c.fillStyle = COL.coral; shadow(c, `rgba(251,146,60,${0.3 + 0.5 * heat})`, 12 + 24 * pop);
        c.fillText(String(days), 0, 0); noShadow(c); c.restore();
        c.font = fn(600, 18); c.fillStyle = COL.txt3; c.fillText('day streak', cx0 + 122, sy0 + 176);
        // heatmap 10 × 3
        const cell = 22, gap = 7, gx = cx0 + cw - 30 - (10 * cell + 9 * gap), gy = sy0 + 62;
        c.font = fn(700, 12); c.fillStyle = COL.txt4; c.letterSpacing = '2.5px'; c.fillText('LAST 30 DAYS', gx, sy0 + 44); c.letterSpacing = '0px';
        for (let k = 0; k < 30; k++) {
          const col = k % 10, row = Math.floor(k / 10);
          const ex = gx + col * (cell + gap), ey = gy + row * (cell + gap);
          const day = k + 1;
          const on = day <= days;
          let s = 1, glow = 0;
          if (day > 12 && on) { const pp = prog(t, stepTime(day - 12), 0.26); s = lerp(1.7, 1, E.outBack(pp)); glow = 1 - pp; }
          c.save(); c.translate(ex + cell / 2, ey + cell / 2); c.scale(s, s);
          rr(c, -cell / 2, -cell / 2, cell, cell, 6);
          if (on) {
            const a = 0.45 + 0.55 * (day / 30);
            c.fillStyle = `rgba(74,222,128,${a})`; if (glow > 0) shadow(c, 'rgba(74,222,128,0.9)', 18 * glow); c.fill(); noShadow(c);
          } else { c.fillStyle = 'rgba(255,255,255,0.05)'; c.fill(); }
          c.restore();
        }
        c.restore();
      }
    }

    // ---- bottom nav: the Plate ----
    {
      const nx = X + 22, ny = Y + L.navY, nw = sw - 44, nh = 150;
      c.save(); c.globalAlpha = ui;
      shadow(c, 'rgba(0,0,0,0.5)', 30, 10); rr(c, nx, ny, nw, nh, 30); c.fillStyle = '#202227'; c.fill(); noShadow(c);
      rr(c, nx, ny, nw, nh, 30); c.strokeStyle = 'rgba(255,255,255,0.06)'; c.lineWidth = 1.5; c.stroke();
      const secs = ['My Activities', 'Categories', 'Map'];
      c.font = fn(700, 17); c.textAlign = 'center'; c.textBaseline = 'middle';
      secs.forEach((s, i) => { const sx2 = nx + nw * (i + 0.5) / 3; c.fillStyle = i === 0 ? COL.txt : COL.txt3; c.fillText(s, sx2, ny + 34); });
      indicator(c, nx + nw / 6, ny + 56, 90, COL.blue);
      c.fillStyle = 'rgba(255,255,255,0.06)'; c.fillRect(nx + 20, ny + 68, nw - 40, 1.5);
      const tabs = ['Social', 'Pursuits', 'Activities', 'More'];
      tabs.forEach((s, i) => {
        const tx = nx + nw * (i + 0.5) / 4, ty = ny + 98, on = i === 2, col = on ? COL.blue : 'rgba(255,255,255,0.45)';
        c.save(); c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 2.4; c.lineCap = 'round'; c.lineJoin = 'round';
        if (on) shadow(c, 'rgba(90,159,212,0.7)', 14);
        if (i === 0) { c.beginPath(); c.arc(tx - 5, ty - 6, 6, 0, TAU); c.stroke(); c.beginPath(); c.arc(tx - 5, ty + 12, 11, Math.PI * 1.1, Math.PI * 1.9); c.stroke(); c.beginPath(); c.arc(tx + 9, ty - 3, 4.5, 0, TAU); c.stroke(); }
        else if (i === 1) { const pts = [[-10, 9], [0, 0], [10, -9], [10, 8]]; c.beginPath(); c.moveTo(tx - 10, ty + 9); c.lineTo(tx, ty); c.lineTo(tx + 10, ty - 9); c.moveTo(tx, ty); c.lineTo(tx + 10, ty + 8); c.stroke(); pts.forEach(([a, b]) => { c.beginPath(); c.arc(tx + a, ty + b, 3.6, 0, TAU); c.fill(); }); }
        else if (i === 2) { rr(c, tx - 12, ty - 13, 18, 24, 4); c.stroke(); c.beginPath(); c.arc(tx + 7, ty + 6, 7, 0, TAU); c.stroke(); c.beginPath(); c.moveTo(tx + 3.5, ty + 6); c.lineTo(tx + 6, ty + 8.5); c.lineTo(tx + 10.5, ty + 3.5); c.stroke(); }
        else { for (let k = -1; k <= 1; k++) { c.beginPath(); c.arc(tx + k * 9, ty, 3, 0, TAU); c.fill(); } }
        noShadow(c);
        c.font = fn(700, 14); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(s, tx, ty + 30);
        c.restore();
      });
      c.restore();
    }
    // home indicator
    rr(c, X + sw / 2 - 70, Y + sh - 18, 140, 6, 3); c.fillStyle = 'rgba(255,255,255,0.35)'; c.fill();

    // ---- +XP flies from each card into the bar's leading edge ----
    CARDS.forEach((cd, i) => {
      const tap = T.taps[i], fp = prog(t, tap + 0.02, 0.5);
      if (fp <= 0 || fp >= 1) return;
      const cy = Y + L.cardsY + i * (L.cardH + L.cardGap);
      const from = [cx0 + cw * 0.3, cy + L.cardH * 0.45];
      const xsAt = xpState(tap + 0.42);
      const to = [X + L.barX + L.barW * clamp(xsAt.pct, 0, 1), Y + L.barY + 5];
      const e = E.inOutCubic(fp);
      const px = lerp(from[0], to[0], e) + Math.sin(e * Math.PI) * 60;
      const py = lerp(from[1], to[1], e);
      c.save(); c.globalAlpha = clamp(fp * 6, 0, 1) * (1 - Math.pow(fp, 4));
      const s = lerp(1.15, 0.55, e);
      c.translate(px, py); c.scale(s, s);
      c.font = fn(800, 40); c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillStyle = COL.greenXp; shadow(c, 'rgba(109,191,126,0.8)', 22);
      c.fillText(`+${cd.xp} XP`, 0, 0); noShadow(c); c.restore();
      // arrival spark on the bar
      const ap = prog(t, tap + 0.46, 0.35);
      if (ap > 0 && ap < 1) {
        c.save(); c.globalCompositeOperation = 'lighter';
        const r = 16 + 40 * ap, g = c.createRadialGradient(to[0], to[1], 0, to[0], to[1], r);
        g.addColorStop(0, `rgba(191,227,255,${0.9 * (1 - ap)})`); g.addColorStop(1, 'rgba(90,159,212,0)');
        c.fillStyle = g; c.fillRect(to[0] - r, to[1] - r, r * 2, r * 2); c.restore();
      }
    });
  }

  /* ---------------- hero: LEVEL 10 ---------------- */
  function drawHero(c, t) {
    const out = prog(t, T.heroOut, 0.32);
    if (out >= 1) return;
    blurGroup(c, out > 0.05 ? out * 14 : 0, 1 - out, k => {
      if (out > 0) { const s = lerp(1, 0.86, E.inQuad(out)); k.translate(CX, HERO_Y); k.scale(s, s); k.translate(-CX, -HERO_Y); }
      heroBody(k, t, out);
    });
  }
  function heroBody(c, t, out) {
    const env = prog(t, T.land, 0.25) * (1 - out);
    c.save();

    // god-rays (gold, slow)
    if (env > 0) {
      c.save(); c.globalCompositeOperation = 'lighter';
      const n = 16, rot = t * 0.12;
      for (let i = 0; i < n; i++) {
        const a = rot + i * TAU / n, wA = 0.035 + 0.02 * hashf(i, 3), len = 1150;
        const g = c.createRadialGradient(CX, HERO_Y, 0, CX, HERO_Y, len);
        g.addColorStop(0, `rgba(245,197,99,${0.1 * env})`); g.addColorStop(1, 'rgba(245,197,99,0)');
        c.fillStyle = g; c.beginPath(); c.moveTo(CX, HERO_Y);
        c.arc(CX, HERO_Y, len, a - wA, a + wA); c.closePath(); c.fill();
      }
      c.restore();
    }

    // LEVEL kicker
    const kp = prog(t, T.roll, 0.4);
    c.save(); c.globalAlpha *= kp;
    c.font = fn(800, 46); c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.fillStyle = COL.txt2;
    c.letterSpacing = '22px'; c.fillText('LEVEL', CX + 11, HERO_Y - 330 + lerp(24, 0, E.outCubic(kp))); c.letterSpacing = '0px';
    c.restore();

    // the number: 9 rolls out, 10 lands
    const S = 540;
    c.font = fn(900, S); c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.letterSpacing = '-22px';
    const asc = c.measureText('10').actualBoundingBoxAscent || S * 0.73;
    const base = HERO_Y + asc / 2;
    const o9 = prog(t, T.roll, 0.28);
    if (o9 < 1) {
      c.save(); c.globalAlpha *= 1 - E.inQuad(o9); if (o9 > 0.02) c.filter = `blur(${(o9 * 18).toFixed(1)}px)`;
      const w9 = c.measureText('9').width;
      c.fillStyle = brandGrad(c, CX - w9 / 2, w9, base, asc, 0.3);
      c.fillText('9', CX + 11, base - inCubic(o9) * 520); c.restore();
    }
    const i10 = prog(t, T.roll + 0.1, 0.32);
    if (i10 > 0) {
      const w10 = c.measureText('10').width;
      const yOff = lerp(560, 0, E.outBack(i10, 1.3));
      c.save(); c.globalAlpha *= clamp(i10 * 3, 0, 1);
      const land = 1 - prog(t, T.land, 0.5);
      if (land > 0 && t >= T.land) shadow(c, `rgba(245,197,99,${0.8 * land})`, 90 * land);
      else shadow(c, 'rgba(90,159,212,0.35)', 50);
      c.fillStyle = brandGrad(c, CX - w10 / 2, w10, base, asc, 0.3);
      c.fillText('10', CX + 11, base + yOff); noShadow(c);
      // gold trace: draws on around every contour, then leaves (like the app's trace)
      const on = E.inOutCubic(prog(t, T.land + 0.02, 1.0));
      const offP = E.inOutCubic(prog(t, T.land + 1.25, 0.9));
      if (on > 0 && offP < 1) {
        const Lp = 2600;
        c.lineJoin = 'round'; c.lineCap = 'round';
        c.setLineDash([Lp, Lp]); c.lineDashOffset = Lp * (1 - on) - Lp * offP;
        c.strokeStyle = 'rgba(245,197,99,0.95)'; c.lineWidth = 7;
        shadow(c, 'rgba(245,197,99,0.9)', 26); c.strokeText('10', CX + 11, base + yOff);
        c.strokeStyle = 'rgba(255,244,214,0.9)'; c.lineWidth = 2.5; shadow(c, 'rgba(245,197,99,0.7)', 8);
        c.strokeText('10', CX + 11, base + yOff); noShadow(c);
        c.setLineDash([]);
      }
      c.restore();
    }
    c.letterSpacing = '0px';

    // shockwaves
    for (const [d, col, maxR, w0] of [[0, COL.gold, 900, 16], [0.1, COL.blue, 700, 10], [0.22, COL.gold, 520, 6]]) {
      const p = prog(t, T.land + d, 1.0);
      if (p <= 0 || p >= 1) continue;
      c.save(); c.globalAlpha *= (1 - p) * 0.85; c.beginPath();
      c.arc(CX, HERO_Y, lerp(140, maxR, E.outExpo(p)), 0, TAU);
      c.lineWidth = lerp(w0, 1, p); c.strokeStyle = col; shadow(c, col, 30); c.stroke(); c.restore();
    }
    // sparks + embers
    sparkleBurst(c, CX, HERO_Y, prog(t, T.land, 1.4), 42, 640);
    const ep = t - T.land;
    if (ep > 0) {
      c.save(); c.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 70; i++) {
        const life = 1.3 + 1.1 * hashf(i, 7), q = ep / life;
        if (q >= 1) continue;
        const a = i * 2.39996 + hashf(i, 9), sp = 260 + 520 * hashf(i, 11);
        const d = sp * E.outCubic(q);
        const px = CX + Math.cos(a) * d, py = HERO_Y + Math.sin(a) * d - 160 * q * q;
        const s = (1.5 + 3.5 * hashf(i, 13)) * (1 - q * 0.6);
        c.globalAlpha = (1 - q) * (0.5 + 0.5 * Math.sin(ep * 18 + i));
        c.fillStyle = i % 3 === 0 ? '#ffffff' : COL.gold;
        c.beginPath(); c.arc(px, py, s, 0, TAU); c.fill();
      }
      c.restore();
    }
    c.restore();
  }

  /* ---------------- brand lockup ---------------- */
  let WM_CV = null;
  function drawLockup(c, t) {
    if (t < T.logo - 0.05) return;
    const ip = prog(t, T.logo, 0.55);
    const bob = Math.sin((t - T.logo) * TAU / 3) * 7 * prog(t, T.logo + 0.4, 0.8);
    const iy = LOCK.iconY + bob;
    // lp-logo-pulse: soft blue halo breathing behind the mark
    const pulse = 1 + 0.18 * (0.5 - 0.5 * Math.cos((t - T.logo) * TAU / 2.8));
    const hr = 330 * pulse * E.outCubic(ip);
    if (hr > 1) {
      const g = c.createRadialGradient(CX, iy, 0, CX, iy, hr);
      g.addColorStop(0, `rgba(90,159,212,${0.34 * ip})`); g.addColorStop(0.7, `rgba(90,159,212,${0.06 * ip})`); g.addColorStop(1, 'rgba(90,159,212,0)');
      c.fillStyle = g; c.fillRect(CX - hr, iy - hr, hr * 2, hr * 2);
    }
    // entrance ring
    const rp = prog(t, T.logo, 0.9);
    if (rp > 0 && rp < 1) { c.save(); c.globalAlpha = (1 - rp) * 0.7; c.beginPath(); c.arc(CX, iy, lerp(60, 520, E.outExpo(rp)), 0, TAU); c.lineWidth = lerp(8, 1, rp); c.strokeStyle = COL.blue; shadow(c, COL.blue, 24); c.stroke(); c.restore(); }
    // the mark
    if (MK_ICON_CV && ip > 0) {
      const s = lerp(0.35, 1, E.outBack(ip, 1.6)), sz = LOCK.icon * s;
      c.save(); c.globalAlpha = clamp(ip * 3, 0, 1);
      const bl = (1 - clamp(ip * 2.2, 0, 1)) * 22; if (bl > 0.4) c.filter = `blur(${bl.toFixed(1)}px)`;
      shadow(c, 'rgba(90,159,212,0.55)', 40);
      c.drawImage(MK_ICON_CV, CX - sz / 2, iy - sz / 2, sz, sz);
      c.restore();
    }
    // wordmark "Mindkraft" — letters rise in, then one light sweep
    const S = 136, word = 'Mindkraft';
    if (!WM_CV) { WM_CV = document.createElement('canvas'); WM_CV.width = W; WM_CV.height = 260; }
    const k = WM_CV.getContext('2d');
    k.setTransform(1, 0, 0, 1, 0, 0); k.clearRect(0, 0, W, 260);
    k.font = fn(800, S); k.textBaseline = 'alphabetic'; k.textAlign = 'left';
    const tr = -0.045 * S, xs = glyphXs(k, word, tr), tw = trackedWidth(k, word, tr);
    const x0 = CX - tw / 2, bY = 190, asc = k.measureText('M').actualBoundingBoxAscent || S * 0.73;
    const grad = k.createLinearGradient(x0, bY - asc, x0 + tw, bY + 20);
    grad.addColorStop(0.25, '#ffffff'); grad.addColorStop(1, COL.blue);
    let any = false;
    for (let i = 0; i < word.length; i++) {
      const lp = prog(t, T.word + i * 0.04, 0.5);
      if (lp <= 0) continue; any = true;
      k.save(); k.globalAlpha = clamp(lp * 2.2, 0, 1);
      k.fillStyle = grad; k.fillText(word[i], x0 + xs[i], bY + lerp(46, 0, E.outCubic(lp)));
      k.restore();
    }
    if (any) {
      const sp = prog(t, 13.35, 0.9);
      if (sp > 0 && sp < 1) {
        const gx = lerp(x0 - 200, x0 + tw + 200, E.inOutCubic(sp));
        k.save(); k.globalCompositeOperation = 'source-atop';
        const g = k.createLinearGradient(gx - 120, 0, gx + 120, 0);
        g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.85)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        k.fillStyle = g; k.fillRect(0, 0, W, 260); k.restore();
      }
      c.drawImage(WM_CV, 0, LOCK.wordY - bY);
    }
    // url pill
    const up = prog(t, T.url, 0.5);
    if (up > 0) {
      c.save(); c.globalAlpha = E.outCubic(up);
      const uy = LOCK.urlY + lerp(22, 0, E.outCubic(up));
      c.font = fn(600, 38); c.letterSpacing = '1px'; c.textAlign = 'center'; c.textBaseline = 'middle';
      const txt = 'mindkraft.life', w = c.measureText(txt).width + 64;
      rr(c, CX - w / 2, uy - 37, w, 74, 37); c.fillStyle = 'rgba(255,255,255,0.05)'; c.fill();
      rr(c, CX - w / 2, uy - 37, w, 74, 37); c.strokeStyle = 'rgba(255,255,255,0.08)'; c.lineWidth = 1.5; c.stroke();
      c.fillStyle = COL.txt2; c.fillText(txt, CX, uy + 1); c.letterSpacing = '0px';
      c.restore();
    }
  }

  /* ---------------- atmosphere ---------------- */
  function drawBg(c, t) {
    sceneBg(c, W, H, prog(t, T.land, 1.2));
    const dark = 0.78 - 0.78 * E.inOut(prog(t, 2.2, 0.8)) + 0.38 * prog(t, T.heroOut, 0.3) - 0.38 * prog(t, T.outro, 0.5);
    if (dark > 0.001) { c.fillStyle = `rgba(9,9,11,${dark})`; c.fillRect(0, 0, W, H); }
    // gold bloom for the level-up, blue bloom for the lockup
    const gEnv = prog(t, T.land - 0.05, 0.3) * (1 - prog(t, T.heroOut, 0.35));
    if (gEnv > 0) { const g = c.createRadialGradient(CX, HERO_Y, 0, CX, HERO_Y, 820); g.addColorStop(0, `rgba(245,197,99,${0.2 * gEnv})`); g.addColorStop(1, 'rgba(245,197,99,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H); }
    const bEnv = prog(t, T.logo - 0.1, 0.6);
    if (bEnv > 0) { const g = c.createRadialGradient(CX, LOCK.iconY + 120, 0, CX, LOCK.iconY + 120, 900); g.addColorStop(0, `rgba(74,124,158,${0.2 * bEnv})`); g.addColorStop(1, 'rgba(74,124,158,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H); }
    // drifting dust
    const dA = 0.35 + 0.65 * Math.max(gEnv, bEnv, prog(t, 2.4, 1.0) * 0.6);
    c.save();
    for (let i = 0; i < 46; i++) {
      const sp = 18 + 40 * hashf(i, 21);
      const x = hashf(i, 22) * W + Math.sin(t * 0.4 + i) * 18;
      const y = ((hashf(i, 23) * (H + 200) - t * sp) % (H + 200) + H + 200) % (H + 200) - 100;
      const s = 1 + 2.2 * hashf(i, 24);
      c.globalAlpha = dA * (0.08 + 0.22 * hashf(i, 25)) * (0.6 + 0.4 * Math.sin(t * 2 + i * 1.7));
      c.fillStyle = i % 4 === 0 ? '#bfe3ff' : '#ffffff';
      c.beginPath(); c.arc(x, y, s, 0, TAU); c.fill();
    }
    c.restore();
  }
  function vignette(c) {
    const g = c.createRadialGradient(CX, H * 0.46, H * 0.28, CX, H * 0.5, H * 0.78);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
  }

  return {
    meta: { title: 'Mindkraft — Life Has No XP Bar', w: W, h: H, fps: 60, duration: 15.0 },

    timeline: [
      { t: 0.05, label: 'LIFE / HAS NO / XP BAR. — three kinetic slams' },
      { t: 1.2, label: 'An empty XP track draws across — the thing life is missing' },
      { t: 1.95, label: 'A blue spark ignites the track; the words blow away' },
      { t: 2.2, label: 'Track flies up into the app header as the phone rises; cards cascade in' },
      { t: 3.45, label: 'Tap · tap · tap · tap — four habits complete, +XP flies into the bar' },
      { t: 5.7, label: 'Streak time-lapse: day 12 → 30, heatmap lights up, bar charges' },
      { t: 7.45, label: 'Bar tops out — camera dives into the level digit, flash' },
      { t: 8.3, label: 'HERO — LEVEL 9 → 10 lands: gold trace, shockwaves, sparks' },
      { t: 10.3, label: 'NOW / IT / DOES. — bookend slams; the track returns, full and blazing' },
      { t: 11.72, label: 'Words blow away; the bar becomes the brand underline' },
      { t: 12.05, label: 'The brain-MK mark blooms' },
      { t: 12.28, label: 'Mindkraft wordmark rises in, then mindkraft.life — hold to end' },
    ],

    draw(c, t) {
      const [shx, shy] = shake(t);
      c.save(); c.translate(shx, shy);
      drawBg(c, t);
      const size = slamSize(c);

      // ---- ACT I: the hook ----
      if (t < T.blow + 0.9) {
        HOOK.forEach((s, i) => slamLine(c, s, LINE_Y[i], size, t, T.w[i], T.blow + i * 0.06, null));
        // hit flashes
        for (let i = 0; i < 3; i++) { const f = 1 - prog(t, T.w[i] + 0.04, 0.18); if (f > 0 && f < 1) { c.fillStyle = `rgba(255,255,255,${0.05 * f})`; c.fillRect(-40, -40, W + 80, H + 80); } }
      }
      // empty track draws on, then sparks
      const hookPct = tween(t, T.spark, 0.35, 0, 0.1);
      if (t >= T.track && t < T.rise) {
        const rev = E.inOutCubic(prog(t, T.track, 0.55));
        c.save(); if (rev < 1) { c.beginPath(); c.rect(TRACK.x - 60, TRACK.y - 80, (TRACK.w + 120) * rev, 160); c.clip(); }
        const fl = t >= T.spark ? Math.max(0.35, 1 - prog(t, T.spark, 0.5) * 0.65) : 0;
        bigTrack(c, TRACK.x, TRACK.y, TRACK.w, TRACK.h, hookPct, fl, 1);
        c.restore();
      }

      // ---- ACT II: the app ----
      const ps = phoneState(t);
      let cam = { s: 1, fx: CX, fy: H / 2, ax: CX, ay: H / 2 };
      const pcx = CX, pcy = ps.y + PH * ps.s / 2;
      if (t >= T.rise && t < T.flash + 0.06) {
        // frame the UI tighter once the phone lands (keeps it clear of IG's overlays), then push in
        const frame = E.inOutCubic(prog(t, T.rise + 0.35, 0.9));
        const push = E.inOut(prog(t, T.streak, T.streakDur + 0.1));
        const fy0 = lerp(pcy, ps.y + 560, frame);
        cam = { s: 1 + 0.1 * frame + 0.06 * push, fx: pcx, fy: fy0, ax: pcx, ay: lerp(pcy, 815, frame) };
        if (t >= T.dive) {
          const q = prog(t, T.dive, T.flash - T.dive);
          const [dlx, dly] = levelDigitCenter(c);
          const [gx, gy] = toGlobal(ps, dlx, dly);
          const e = inCubic(q), m = E.inOutCubic(q);
          cam = { s: lerp(cam.s, 8.4, e), fx: lerp(cam.fx, gx, m), fy: lerp(cam.fy, gy, m), ax: lerp(cam.ax, CX, m), ay: lerp(cam.ay, HERO_Y, m) };
        }
        c.save();
        c.translate(cam.ax, cam.ay); c.scale(cam.s, cam.s); c.translate(-cam.fx, -cam.fy);
        const blurDive = t >= T.dive ? Math.sin(prog(t, T.dive, T.flash - T.dive) * Math.PI * 0.5) * 7 : 0;
        blurGroup(c, blurDive, 1, k => {
          k.translate(ps.x, ps.y); k.scale(ps.s, ps.s);
          phone(k, 0, 0, PW, PH, (cc, sx, sy, sw, sh) => drawScreen(cc, sx, sy, sw, sh, t));
        });
        // the hook's track flying into the header bar
        if (t < T.rise + T.morph) {
          const q = E.inOutCubic(prog(t, T.rise, T.morph));
          const [bx, by] = toGlobal(ps, L.barX, L.barY);
          const bw = L.barW * ps.s, bh = L.barH * ps.s;
          const x = lerp(TRACK.x, bx, q), y = lerp(TRACK.y, by, q), w = lerp(TRACK.w, bw, q), h = lerp(TRACK.h, bh, q);
          bigTrack(c, x, y, w, h, 0.1, lerp(0.35, 0, q), 1);
        }
        c.restore();
      }

      // ---- the dive flash ----
      const fl = t < T.flash ? Math.pow(prog(t, T.flash - 0.14, 0.14), 2) : 1 - prog(t, T.flash, 0.38);
      // ---- ACT III: the hero ----
      if (t >= T.flash) drawHero(c, t);
      if (fl > 0) { c.fillStyle = `rgba(226,240,255,${0.95 * fl})`; c.fillRect(-40, -40, W + 80, H + 80); }

      // ---- ACT IV: the payoff ----
      if (t >= T.n[0] && t < T.payOut + 0.9) {
        PAY.forEach((s, i) => slamLine(c, s, LINE_Y[i], size, t, T.n[i], T.payOut + i * 0.04,
          i === 2 ? (cc, x0, w, base, asc) => brandGrad(cc, x0, w, base, asc, 0.05) : null));
        for (let i = 0; i < 3; i++) { const f = 1 - prog(t, T.n[i] + 0.04, 0.18); if (f > 0 && f < 1) { c.fillStyle = `rgba(255,255,255,${0.05 * f})`; c.fillRect(-40, -40, W + 80, H + 80); } }
      }
      if (t >= T.fill - 0.25) {
        const vis = prog(t, T.fill - 0.25, 0.25);
        const pct = tween(t, T.fill, 0.5, 0, 1, E.outExpo);
        const flare = t < T.fill ? 0.3 : (pct < 0.999 ? 1 : 0.35 + 0.25 * Math.sin((t - T.fill) * 5));
        const m = E.inOutCubic(prog(t, T.outro, 0.5));
        const tgtW = 470;
        const x = lerp(TRACK.x, CX - tgtW / 2, m), y = lerp(TRACK.y, LOCK.lineY, m), w = lerp(TRACK.w, tgtW, m), h = lerp(TRACK.h, 4, m);
        c.save(); c.globalAlpha = vis * (1 - prog(t, T.outro + 0.35, 0.2));
        bigTrack(c, x, y, w, h, pct, flare * (1 - m), 1.2);
        // one shine across the full bar
        const sp = prog(t, T.fill + 0.55, 0.55);
        if (sp > 0 && sp < 1) {
          c.save(); rr(c, x, y, w, h, h / 2); c.clip();
          const gx = lerp(x - 120, x + w + 120, sp), g = c.createLinearGradient(gx - 90, 0, gx + 90, 0);
          g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.9)'); g.addColorStop(1, 'rgba(255,255,255,0)');
          c.fillStyle = g; c.fillRect(gx - 90, y, 180, h); c.restore();
        }
        c.restore();
        // it settles as the glowing indicator under the wordmark
        const ind = prog(t, T.outro + 0.35, 0.3);
        if (ind > 0) { c.save(); c.globalAlpha = ind; indicator(c, CX, LOCK.lineY, tgtW + 60 * Math.sin(ind * Math.PI * 0.5), COL.blue); indicator(c, CX, LOCK.lineY, tgtW * 0.6, '#bfe3ff'); c.restore(); }
      }

      // ---- ACT V: lockup ----
      drawLockup(c, t);
      const lf = 1 - prog(t, T.logo, 0.3);
      if (t >= T.logo && lf > 0) { c.fillStyle = `rgba(90,159,212,${0.12 * lf})`; c.fillRect(-40, -40, W + 80, H + 80); }

      c.restore();
      vignette(c);
    }
  };
})();
// ============ SCENE:END ====================================================

/* ===== PLAYER / RECORDER (engine — do not edit) ===== */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let DUR=SCENE.meta.duration, FPS=SCENE.meta.fps;
let st={t:0,playing:false,recording:false,raf:0,wall:0};
let rec=null, chunks=[];

function fitCanvas(){ cv.width=SCENE.meta.w; cv.height=SCENE.meta.h; }
function renderFrame(t){
  t=clamp(t,0,DUR);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  try{ SCENE.draw(ctx,t); }catch(e){ console.error('SCENE.draw error',e); }
}
function fmt(x){return x.toFixed(2);}
function updateUI(){
  document.getElementById('time').textContent=`${fmt(st.t)} / ${fmt(DUR)}s`;
  document.getElementById('scrub').value=String(Math.round(st.t/DUR*1000));
  const beats=document.querySelectorAll('.beat');
  SCENE.timeline.forEach((b,i)=>{
    const next=SCENE.timeline[i+1];
    const on = st.t>=b.t && (!next || st.t<next.t);
    if(beats[i]) beats[i].classList.toggle('on',on);
  });
}
function loop(){
  const now=performance.now();
  st.t=(now-st.wall)/1000;
  if(st.t>=DUR){
    st.t=DUR; renderFrame(st.t); updateUI();
    st.playing=false;
    if(st.recording) stopRecording();
    document.getElementById('playBtn').innerHTML='&#9654; Play';
    return;
  }
  renderFrame(st.t); updateUI();
  st.raf=requestAnimationFrame(loop);
}
function play(){
  if(st.playing)return;
  if(st.t>=DUR-0.001) st.t=0;
  st.playing=true; st.wall=performance.now()-st.t*1000;
  document.getElementById('playBtn').innerHTML='&#10073;&#10073; Pause';
  st.raf=requestAnimationFrame(loop);
}
function pause(){
  st.playing=false; cancelAnimationFrame(st.raf);
  document.getElementById('playBtn').innerHTML='&#9654; Play';
}
function togglePlay(){ st.playing?pause():play(); }
function restart(){ pause(); st.t=0; renderFrame(0); updateUI(); }
function onScrub(v){
  pause(); st.t=(v/1000)*DUR; renderFrame(st.t); updateUI();
}

function pickMime(){
  const c=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  for(const m of c){ if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m; }
  return '';
}
function toggleRecord(){ st.recording?stopRecording():startRecording(); }
function startRecording(){
  if(!window.MediaRecorder){ setStatus('MediaRecorder not supported in this browser',''); return; }
  const mime=pickMime();
  const stream=cv.captureStream(FPS);
  try{ rec=new MediaRecorder(stream, mime?{mimeType:mime,videoBitsPerSecond:12000000}:undefined); }
  catch(e){ setStatus('Could not start recorder: '+e.message,''); return; }
  chunks=[];
  rec.ondataavailable=e=>{ if(e.data&&e.data.size>0)chunks.push(e.data); };
  rec.onstop=()=>{
    const blob=new Blob(chunks,{type:mime||'video/webm'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=slug(SCENE.meta.title)+'.webm';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    setStatus('Saved '+a.download+' ('+(blob.size/1048576).toFixed(1)+' MB)','done');
  };
  st.recording=true;
  const b=document.getElementById('recBtn'); b.classList.add('armed'); b.innerHTML='&#9632; Stop';
  setStatus('Recording…','live');
  restart(); rec.start(); play();
  // status ticker
  const tick=()=>{ if(st.recording){ setStatus('Recording… '+fmt(st.t)+'s','live'); requestAnimationFrame(tick); } };
  requestAnimationFrame(tick);
}
function stopRecording(){
  if(!st.recording)return;
  st.recording=false;
  const b=document.getElementById('recBtn'); b.classList.remove('armed'); b.innerHTML='&#9679; Record &amp; download';
  try{ if(rec&&rec.state!=='inactive') rec.stop(); }catch(e){}
}
function setStatus(msg,cls){ const s=document.getElementById('status'); s.textContent=msg; s.className='status'+(cls?(' '+cls):''); }
function slug(s){ return (s||'mindkraft-scene').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60)||'mindkraft-scene'; }

function buildTimeline(){
  const el=document.getElementById('beats'); el.innerHTML='';
  SCENE.timeline.forEach(b=>{
    const d=document.createElement('div'); d.className='beat';
    d.innerHTML=`<span class="tt">${b.t.toFixed(1)}s</span><span class="lbl">${b.label}</span>`;
    el.appendChild(d);
  });
}
function boot(){
  fitCanvas();
  DUR=SCENE.meta.duration; FPS=SCENE.meta.fps;
  document.getElementById('mRes').textContent=SCENE.meta.w+'×'+SCENE.meta.h;
  document.getElementById('mFps').textContent=FPS;
  document.getElementById('mDur').textContent=DUR.toFixed(1);
  buildTimeline();
  const first=()=>{ renderFrame(0); updateUI(); };
  if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(first); setTimeout(first,400);} else first();
}
boot();
</script>
